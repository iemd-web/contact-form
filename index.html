<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Form</title>
  <link rel="stylesheet" href="/contact-form/css/contact-form.css">
</head>
<body>
  <form method="POST" action="https://formspree.io/f/mbgjlnzl">
    <fieldset>
      <div>
        <label for="name">Your Name (Optional):</label>
        <br>
        <input type="text" name="name" id="name" placeholder="Rick Deckard">
        <br>
        <br>
      </div>
      <div>
        <label for="email">Your Email Address (Required):</label>
        <br>
        <input type="email" name="email" id="email" placeholder="R.Deckard@gmail.com" required>
        <br>
        <br>
      </div>
      <div>
        <label for="message">Your Message (Required):</label>
        <br>
        <textarea rows="5" name="message" id="message" placeholder="Start typing..." required></textarea>
        <br>
        <br>
      </div>
      <button type="submit">Send Message</button>
    </fieldset>
  </form>
</body>
</html>
