<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Form</title>
  <link rel="stylesheet" href="/contact-form/css/contact-form.css">
</head>
<body>
  <form method="POST" action="https://formspree.io/f/mbgjlnzl">
    <fieldset class="inside-form">
      <div class="info">
        <div>
          <br>
          <label for="name">Name</label>
          <br>
          <input type="text" name="name" class="name" placeholder="Rick Deckard">
          <br>
        </div>
        <div>
          <label for="email">Email (required)</label>
          <br>
          <input type="email" name="email" class="email" placeholder="R.Deckard@gmail.com" required>
          <br>
          <br>
        </div>
      </div>
      <div>
        <label for="message">Your Message (required)</label>
        <br>
        <textarea rows="5" name="message" id="message" placeholder="Start typing..." required></textarea>
        <br>
      </div>
      <button type="submit">Send Message</button>
    </fieldset>
  </form>
</body>
</html>
