<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Form</title>
  <link rel="stylesheet" href="/contact-form/css/contact-form.css">
</head>
<body>
  <form method="POST" action="https://formspree.io/f/mbgjlnzl">
    <fieldset class="inside-form">
      <div class="info">
        <div>
          <label for="name">Name</label>
          <br>
          <input type="text" id="name" name="name" class="name" placeholder="Rick Deckard">
          <br>
        </div>
        <div>
          <label for="email">Email (required)</label>
          <br>
          <input type="email" id="email" name="email" class="email" placeholder="R.Deckard@gmail.com" required>
          <br>
          <br>
        </div>
      </div>
      <div>
        <label for="message">Your Message (required)</label>
        <div class="md-options">
          <button type="button" class="mdbutton" onclick="wrap ('**')"><b>B</b></button>
          <button type="button" class="mdbutton" onclick="wrap ('*')"><i>I</i></button>
          <button type="button" class="mdbutton" onclick="wrap ('~')"><s>S</s></button>
          <button type="button" class="mdbutton" onclick="wrap ('_')"><u>U</u></button>
          <!--<button id="c-emojiToggle" class="emoji-button" type="button">
            <svg class="emojiface" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <path d="M18 13a6 6 0 0 1-6 5 6 6 0 0 1-6-5h12Z"></path>
              <line x1="9" x2="9.01" y1="9" y2="9"></line> 
              <line x1="15" x2="15.01" y1="9" y2="9"></line>
            </svg>
          </button> might include later...-->
        </div>
        <textarea rows="5" name="message" id="message" placeholder="Start typing..." required></textarea>
        <br>
      </div>
      <button type="submit">Send Message</button>
    </fieldset>
  </form>
</body>
</html>
